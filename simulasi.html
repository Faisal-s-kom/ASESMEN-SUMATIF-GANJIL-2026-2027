<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asesmen Sumatif Ganjil 2026/2027</title>
<style>
  :root {
    --bg: #f3f6f8;
    --surface: #ffffff;
    --ink: #10242e;
    --muted: #55707d;
    --line: #d3dee4;
    --brand: #0b4a5c;
    --brand-ink: #ffffff;
    --accent: #f2b632;
    --disabled-bg: #e6ecef;
    --disabled-ink: #7b9099;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1a21;
      --surface: #142730;
      --ink: #e8f1f4;
      --muted: #94adb8;
      --line: #25404c;
      --brand: #4fb4cf;
      --brand-ink: #06222c;
      --accent: #f2b632;
      --disabled-bg: #1b323c;
      --disabled-ink: #6c8794;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }

  header {
    background: var(--brand);
    color: var(--brand-ink);
    padding: 32px 0 28px;
    border-bottom: 6px solid var(--accent);
  }
  header .wrap { padding-bottom: 0; }
  header .school { margin: 0 0 6px; font-size: 0.95rem; opacity: 0.85; }
  header h1 { margin: 0; font-size: clamp(1.6rem, 6vw, 2.2rem); line-height: 1.15; letter-spacing: -0.01em; }
  header p.sub { margin: 10px 0 0; font-size: 1rem; opacity: 0.9; max-width: 46ch; }

  .notice {
    margin: 20px 0 8px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 5px solid var(--accent);
    border-radius: 6px;
    font-size: 0.95rem;
    color: var(--muted);
  }

  section { margin-top: 28px; }
  section h2 { margin: 0 0 10px; font-size: 1.25rem; }
  section h2 small { font-weight: 400; color: var(--muted); font-size: 0.95rem; margin-left: 6px; }

  ul.kelas { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li.item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 12px 12px 16px;
  }
  .nama { font-weight: 600; font-size: 1.05rem; }

  .btn {
    display: inline-block;
    min-height: 44px;
    padding: 10px 18px;
    border-radius: 6px;
    background: var(--brand);
    color: var(--brand-ink);
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    text-align: center;
    white-space: nowrap;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn.off {
    background: var(--disabled-bg);
    color: var(--disabled-ink);
    cursor: not-allowed;
    pointer-events: none;
  }

  footer { margin-top: 36px; font-size: 0.85rem; color: var(--muted); }

  @media (max-width: 380px) {
    li.item { flex-direction: column; align-items: stretch; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <p class="school">SMA NEGERI 2 TANJUNG SELOR</p>
    <h1>Asesmen Sumatif Ganjil 2026/2027</h1>
    <p class="sub">Pilih kelasmu, lalu tekan tombol untuk membuka soal ujian.</p>
  </div>
</header>

<main class="wrap">
  <div class="notice">
    Pastikan kamu memilih kelas yang sesuai. Isi nama dan kelas dengan benar di dalam formulir soal.
  </div>

  <div id="daftar"></div>
  <noscript>Halaman ini membutuhkan JavaScript. Aktifkan JavaScript lalu muat ulang halaman.</noscript>
</main>

<footer class="wrap">Asesmen Sumatif Ganjil Tahun Pelajaran 2026/2027</p>
Faisal, S.Kom.</footer>

<script>
  /* ============================================================
     EDIT DI SINI
     Ganti tanda kutip kosong "" dengan link Google Form masing-masing kelas.
     Contoh: link: "https://forms.gle/xxxxxxxx"
     Kelas yang linknya masih kosong akan tampil sebagai "Belum tersedia".
     ============================================================ */
  var DATA = [
    { tingkat: "Kelas X", kelas: [
      { nama: "X KELEMPIT", link: "" },
      { nama: "X TA’A",     link: "" },
      { nama: "X KIRIP",    link: "" }
    ]},
    { tingkat: "Kelas XI", kelas: [
      { nama: "XI MERUDUNG", link: "" },
      { nama: "XI PEBATUN",  link: "" },
      { nama: "XI BENUANTA", link: "" }
    ]},
    { tingkat: "Kelas XII", kelas: [
      { nama: "XII PERADI",     link: "" },
      { nama: "XII TENGUYUN",   link: "" },
      { nama: "XII TIGA TAWAI", link: "" }
    ]}
  ];

  var root = document.getElementById("daftar");

  DATA.forEach(function (grup) {
    var sec = document.createElement("section");
    var h2 = document.createElement("h2");
    h2.textContent = grup.tingkat;
    sec.appendChild(h2);

    var ul = document.createElement("ul");
    ul.className = "kelas";

    grup.kelas.forEach(function (k) {
      var li = document.createElement("li");
      li.className = "item";

      var nama = document.createElement("span");
      nama.className = "nama";
      nama.textContent = k.nama;

      var a = document.createElement("a");
      a.className = "btn";
      if (k.link && k.link.trim() !== "") {
        a.href = k.link;
        a.textContent = "Buka soal";
        a.setAttribute("aria-label", "Buka soal " + k.nama);
      } else {
        a.className += " off";
        a.textContent = "Belum tersedia";
        a.setAttribute("aria-disabled", "true");
      }

      li.appendChild(nama);
      li.appendChild(a);
      ul.appendChild(li);
    });

    sec.appendChild(ul);
    root.appendChild(sec);
  });
</script>
</body>
</html>
